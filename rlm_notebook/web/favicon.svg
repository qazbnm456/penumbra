<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="rlm-notebook">
  <!-- The state dot, which is this product's one visual signature, on paper. At 16px a mark has
       room for exactly one idea; the dot is the one that already means something everywhere else
       in the interface. Two fills so the paper follows the reader's own theme rather than flashing
       white in a dark window. -->
  <style>
    .paper { fill: #f9f5ef; }
    .ink { fill: #c2703a; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #221c16; }
      .ink { fill: #e0995f; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="7" />
  <circle class="ink" cx="16" cy="16" r="5.5" />
</svg>
