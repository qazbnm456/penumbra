name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      # `tests/test_readable_error.py` RUNS the shipped `readableError` out of `app.js` through
      # node, because the test it replaced re-compiled that function's regex literals with Python's
      # `re` and never called it - and duly stayed green while the function returned the empty
      # string for the commonest provider failures. Pinned here rather than left to the runner
      # image's default, and the test FAILS rather than skips when node is missing: a test that
      # vanishes when a tool is absent makes a local run greener than CI, which is the trap
      # AGENTS.md's Verify section is about.
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync
        # --extra api: so tests/test_api.py (which imports rlm_notebook.api at module scope) is
        # actually collected and run, not silently skipped. The `api` extra is opt-in for END
        # USERS (pyproject.toml) but CI must still exercise it.
        run: uv sync --python ${{ matrix.python-version }} --extra api
      - name: Tests
        run: uv run --python ${{ matrix.python-version }} python -m pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Lint
        # PINNED deliberately, matching rlm-harness/ctx-distillery — an unpinned `uvx ruff check .`
        # resolves the latest ruff at run time and can redden CI with nobody having touched a line
        # of code. Bump this pin on purpose, and land the resulting fixes in the SAME commit.
        run: uvx ruff@0.16.0 check .
