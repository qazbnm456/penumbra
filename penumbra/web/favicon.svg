<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Penumbra">
  <!-- The app icon's moon at tab size: a round moon rising from the lower right of a night tile,
       half in soft shadow (the penumbra), with the two sleepy eyes that make it a character. At
       16px the smile and the little moon would be noise, so they are left to the app icon. -->
  <defs>
    <linearGradient id="penumbra" x1="0" y1="0.65" x2="1" y2="0.2">
      <stop offset="0.12" stop-color="#8a4a2c" />
      <stop offset="0.3" stop-color="#b8683a" />
      <stop offset="0.46" stop-color="#f6e8ce" />
    </linearGradient>
    <clipPath id="tile"><rect width="32" height="32" rx="7" /></clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#3a2c4a" />
  <circle cx="19.5" cy="21" r="12.5" fill="url(#penumbra)" clip-path="url(#tile)" />
  <path d="M19.4 19.2 a1.6 1.6 0 0 0 3.2 0 M24.4 19.2 a1.6 1.6 0 0 0 3.2 0" fill="none" stroke="#3a283c"
        stroke-width="1.3" stroke-linecap="round" />
</svg>
