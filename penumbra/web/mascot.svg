<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="半影小月">
  <!-- The mascot at portrait size: the app icon's moon without its tile, so it can sit on any
       surface. Half lit, half in soft shadow, with the smile and blush the favicon has no room for.
       Her two props are drawn small: the lantern she reads captures by (a summary) and the thread
       that ties her to the little moon (a relation on the star map). -->
  <defs>
    <linearGradient id="m-penumbra" x1="0" y1="0.7" x2="1" y2="0.25">
      <stop offset="0.1" stop-color="#84462a" />
      <stop offset="0.32" stop-color="#b8683a" />
      <stop offset="0.5" stop-color="#f6e8ce" />
      <stop offset="1" stop-color="#fff6e4" />
    </linearGradient>
    <radialGradient id="m-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- The thread to the little moon. -->
  <path d="M40 40 C32 30 26 26 20 22" fill="none" stroke="#c9a37a" stroke-width="1.6"
        stroke-linecap="round" stroke-dasharray="2.5 3" />
  <circle cx="18" cy="20" r="8" fill="#f6e8ce" />
  <path d="M14 14 a8 8 0 0 0 0 12 a9 9 0 0 1 0 -12z" fill="#b8683a" opacity="0.7" />
  <!-- The moon. -->
  <circle cx="64" cy="66" r="44" fill="url(#m-penumbra)" />
  <!-- Face, on the lit side. -->
  <ellipse cx="62" cy="72" rx="6" ry="3.4" fill="#b8683a" opacity="0.32" />
  <ellipse cx="94" cy="72" rx="6" ry="3.4" fill="#b8683a" opacity="0.32" />
  <path class="m-eyes" d="M64 62 a4 4 0 0 0 8 0 M84 62 a4 4 0 0 0 8 0" fill="none" stroke="#3a283c"
        stroke-width="2.6" stroke-linecap="round" />
  <path d="M74 71 a4 4 0 0 0 8 0" fill="none" stroke="#3a283c" stroke-width="2.2" stroke-linecap="round" />
  <!-- The lantern, hanging from the shaded side. -->
  <circle cx="22" cy="96" r="14" fill="url(#m-glow)" />
  <path d="M22 78 v8" stroke="#c9a37a" stroke-width="1.6" stroke-linecap="round" />
  <rect x="16" y="86" width="12" height="15" rx="4" fill="#ffd9a0" stroke="#84462a" stroke-width="1.6" />
  <path d="M18 86 h8 M18 101 h8" stroke="#84462a" stroke-width="2" stroke-linecap="round" />
</svg>
