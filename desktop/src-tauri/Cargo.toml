[package]
name = "penumbra-desktop"
version = "0.1.0"
description = "Desktop shell for Penumbra"
authors = ["qazbnm456"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "penumbra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
getrandom = "0.2"
open = "5"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSEvent", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
